[project]
name = "grounded-rag-assistant"
version = "0.1.0"
description = "Production-style local RAG assistant over Elasticsearch and AI-search technical documentation."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "elasticsearch",
    "sentence-transformers",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "google-genai",
    "httpx",
    "pypdf",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
