[project]
name = "grounded-rag-assistant"
version = "0.1.0"
description = "Production-style local RAG assistant over Elasticsearch and AI-search technical documentation."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "elasticsearch",
    "sentence-transformers",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "jinja2",
    "python-multipart",
    "google-genai",
    "httpx",
    "pypdf",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    # Project 2 — LangGraph + MCP agent layer. Ranges are capped below the next
    # major. Note langgraph and the langchain-* packages are still 0.x, where
    # minor bumps routinely ship breaking changes — so the <1.0 caps are not a
    # promise of compatibility across minors; revisit pins when bumping them.
    "mcp>=1.0,<2.0",
    "langgraph>=0.2,<1.0",
    # 0.2.x requires langchain-core>=1.0 (imports langchain_core.messages.content);
    # pin to the 0.1.x line, which is compatible with langchain-core 0.3.x + langgraph 0.6.
    "langchain-mcp-adapters>=0.1,<0.2",
    "langchain-core>=0.3,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection idiom: Depends()/Query() are called in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live_network: test hits the live network (GitHub); skipped unless opted in",
]
