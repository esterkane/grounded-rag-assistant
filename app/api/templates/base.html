<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Review{% endblock %} · grounded-rag-assistant</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; line-height: 1.5; }
    header { background: #1f2933; color: #fff; padding: 0.75rem 1.5rem; }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    main { max-width: 60rem; margin: 0 auto; padding: 1.5rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid #d9d9d9; vertical-align: top; }
    th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; color: #52606d; }
    .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .badge.flagged { background: #fde68a; color: #92400e; }
    .badge.ok { background: #bbf7d0; color: #166534; }
    .muted { color: #6b7280; font-size: 0.85rem; }
    .chunk { border: 1px solid #d9d9d9; border-radius: 6px; padding: 0.75rem 1rem; margin: 0.75rem 0; }
    .chunk pre { white-space: pre-wrap; word-wrap: break-word; margin: 0.5rem 0 0; }
    .cite { font-family: ui-monospace, monospace; font-size: 0.8rem; background: #eef2ff; padding: 0.05rem 0.35rem; border-radius: 4px; }
    form.feedback { border: 1px solid #d9d9d9; border-radius: 6px; padding: 1rem; margin-top: 1rem; }
    form.feedback label { display: block; margin: 0.5rem 0 0.2rem; font-weight: 600; }
    form.feedback textarea, form.feedback input[type=text] { width: 100%; box-sizing: border-box; padding: 0.4rem; }
    button { cursor: pointer; padding: 0.4rem 0.9rem; border-radius: 6px; border: 1px solid #1f2933; background: #1f2933; color: #fff; }
    .toolbar { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header><a href="/review">grounded-rag-assistant · review</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
